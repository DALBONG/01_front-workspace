        <fieldset>
            <legend>보기</legend>
            <input type="test" id="inputText" size="40">
        </fieldset>
        <br>

        <button onclick="check()">확인하기</button>

            function check(){
                    // 입력(input) 박스 만들기
                const input = document.getElementById("inputText").value
                    // 출력 박스 만들기
                const output = document.getElementById("output1")
                document.getElementById("output1").innerHTML = "보기의 문자열 길이는 " + input.length+"글자 입니다."
            }
        </script>
