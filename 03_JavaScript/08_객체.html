<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>객체</title>
    <style>
        .area{background-color: rgb(185, 255, 232);
            border: 1px solid rgb(216, 133, 137);}
        .small{height: 200px;}
        .big{ height: 400px;}
    </style>

</head>

<body>
        <h1>객체</h1>
        <p>객체는 {}를 사용해서 생성하고, <br>
        {}안에 객체에서 필요한 속성(property)들을 정의 <br>
        속성명 : 속성값 형태로 정의 (key : value) <br>
        속성값으로 모든 자료형의 값을 담을 수 있음</p>

        <pre>
 변수 = {속성 명:속성 값,
         속성 명:속성 값 .. }
        </pre>
        
        <button onclick="test1()">실행확인</button>
        <div id="area1" class="area big"></div>
        <script>
            function test1() {
                const arr = ["dry Mango", 4000, "chiken", ["mango", "sugar"]]
                const product = {
                    pName : "dry Mango",
                    price : 4000,
                    kind : "chiken",
                    ingredient : ["mango", "sugar"],
                }
                console.log(product)
                console.log(typeof(product))

                const area1 = document.getElementById("area1")
                area1.innerHTML += "product:" + product + "<br>"
                    // toString() 자동호출 > 재정의해서 바꿀 수 있음.    
            }

                //객체의 속성에 접근 하는 방법
                //방법 1. 대괄호를 이용하는 방법 : 객체명["속성 명"]

                area1.innerHTML += "<b>객체명['속성명']으로 접근하기</b><br>"
                area1.innerHTML += "pName:" + product["pName"] + "<br>"
                area1.innerHTML += "price:" + product["price"] + "<br>"
                        // 속성 명은 그냥 쓰면 일반 변수를 찾음. 반드시 " "를 붙여야 함 
                area1.innerHTML += "kind:" + product["kind"] + "<br>"
                area1.innerHTML += "ingredient:" + product["ingredient"][0] + "<br>"

                // 방법2. .을 이용하는 방법 : 객체명.속성명
                area1.innerHTML += "<b>객체명.속성명으로 접근하기</b><br>"
                area1.innerHTML += "pName:" + product.pName + "<br>"
                area1.innerHTML += "price:" + product.price + "<br>"
                area1.innerHTML += "kind:" + product.kind + "<br>"
                area1.innerHTML += "ingredient:" + product.ingredient[1] + "<br>"
        </script>
        <hr>

        <h3>객체에서의 반복문</h3>
        <p>객체가 가지고 있는 모든 속성들에 순차적으로 접근하고자 한다면, 반복문 제시 가능. <br>
            단, 단순한 for문으로는 불가, for in문만 사용 가능</p>

        <button onclick="test3()">실행확인</button>
        <div id="area3" class="area small">
            <script>
                function test3(){
                    const arr = ["박보검", 10, true]
                    for(let i in arr){ //i에 index값이 담김
                        console.log(arr[i])
                    }
                    // in 뒤에 배열 제시시, 반복문이 돌때마다 0~마지막 인덱스까지 인덱스 수가 담김
                }

                const game = {
                    title:"오버워치",
                    price:35000,
                    language:"한국어지원",
                    company:"블리자드",
                }

                const area3 = document.getElementById("area3")
                for(let key in game){   //  key="title" -> key="price"
                
                    //.을 이용해서 접근
                    // area3.innerHTNL += key + ":" + game.key + "<br>"
                        // game 객체에 key라는 속성을 찾고 있음.

                    // 대괄호를 이용해서 접근 
                    area3.innerHTML += key + ":" + game[key] + "<br>"

                    //in뒤에 객체 제시시
                    //반복문 돌 때마다 해당 객체의 속성이 앞쪽 변수에
                }

            </script>

        </div>
</body>
</html>
