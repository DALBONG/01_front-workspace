<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

    <style>
        .wrap, .wrap *{/*wrap과 후손*/
            border: 1px solid lightgray;
            color: gray;
            display: block;
            padding: 5px;
            margin: 15px;
        }
    </style>
</head>
<body>

    <h3>자손 후손 메소드</h3>
    <p>기준이 되는 요소의 하위 요소들을 선택할 수 있는 메소드</p>

     <div class="wrap">

        <div>div(증조할머니)
            <ul>ul(할머니)
                <li>li(엄마)
                    <span>span</span>
                </li>
            </ul>
        </div>

        <div>div(할아버지)
            <p>p(아버지)
                <span>span</span>
            </p>
        </div>

    </div>

    <p>
        <h4> - $("선택자").children()</h4>
            선택된 요소의 모든 자손(바로 하위)요소들 선택해주는 메소드

        <h4> - $("선택자").children("선택자")</h4>
            선택한 요소의 모든 자손중 제시한 값과 일치하는 요소 선택
        
        <h4> - $("선택자").find("선택자")</h4>
            선택한 요소의 모든 후손중 제시한 값과 일치하는 요소 선택
    </p>


<script>
    $(function(){
        // 앞으로 부여할 스타일 객체
        const style1 = {color : "red", border : "2px solid red"};
        const style2 = {color : "blue", border : "2px solid blue"};
        const style3 = {color : "green", border : "2px solid green"};
        const style4 = {color : "orange", border : "2px solid orange"};
        const style5 = {color : "magenta", border : "2px solid magenta"};

        // children
        $(".wrap").children().css(style1);
        $(".wrap").children().children().css(style2);

        // children
        $(".wrap").children().children("ul").css(style3);
        $(".wrap").find("li").css(style4);
        $(".wrap").find("span").css(style5);

    })

    
</script>
    
</body>
</html>
