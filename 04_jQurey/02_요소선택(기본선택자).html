<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요소선택(기본선택자)</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>


</head>
    <body>
        <h1>기본 선택자 이용해서 요소 선택</h1>
        
        <h3>아이디 선택자</h3>
        <p>특정 고유한 id값 '하나만'을 선택</p>
        
        <h1 id="test1">테스트1</h1>
        <h2 id="test2">테스트2</h2>


        <script>
            $(function(){
                // 순수 JS방식 : document.getElementById("id명")
                document.getElementById("test1").style.color = "red"
                    // 선택 요소 객체의 속성에 접근하여 값 변경.
                document.getElementById("test1").innerHTML = "h1변경"

                // jQuery 방식 : $("id명").css
                $("#test2").css("color","yellow")
                $("#test2").html("변경") 
                    //.html 메소드 : 선택한 요소의 innerHTML과 관련된 기능을 수행하는 메소드
                console.log(document.getElementById("test1"))
                console.log($("#test1"))
            })
        </script>
    <hr>
    <h3> * 태그 선택자 </h3>

    <p3>java</p3>
    <p3>oracle</p3>
    <p3>HTML</p3>

    <h5>css</h5>
    <h5>JavaScript</h5>
    <h5>jQuery</h5>

    <script>
        $(document).ready(function(){   // 이 문서가 준비되었을때 함수 실행
                // 순수 JS방식 : document.getElementsByTagName("태그명"); -> 배열
            console.log(document.getElementsByTagName("p"));

            const p = document.getElementsByTagName("p");
            // p.style.color = "pink";
            for(let i=0; i<p.length; i++){
                p[i].style.color = "pink";
            }

            // jQuery 방식 => $(태그명)

        $("h5").css("color", "blue");

        // 여러 종류 요소 선택
        $("p, h5, #id1").css("backgroundColor", "skyblue");


        });
    </script>

    <h3>* 클래스 선택자</h3>
    <h1 class="item">Class1</h1>
    <h1 class="item select">Class2</h1>
    <h1 class="item select">Class3</h1>

    <script>
        $(document).ready(function(){
            // 순수 JS방식 : document.getElementsByClassName("클래스명"); -> 배열
            const item = document.getElementsByClassName("item");
            for(let i=0; i<item.length; i++){
                item[i].style.color = "orange";
                item[i].onclick = function(){
                    console.log("클릭");
                }
            }

            // jQuery 방식
            $(".select").css("backgroundColor", "pink");
            $(".select").click(function(){
                alert("클릭됨");

            })
            // .click : 클릭 이벤트와 관련된 기능 수행하는 메소드
        });
    </script>

<!-- 
    * 요소 선택하는 방법
                 순수 JS방식                ||     jQuery방식
    ------------------------------------------------------------
        document.getElementById("아이디명") ||  $("#아이디명")
     document.getE~~ByclassName("클래스명") ||  $(".클래스명")
     document.getE~~ByTagName ("태그 명")   ||  $("태그명")

     * 선택한 요소 속성값 변경
     선택된 요소 객체의 속성에 직접 접근      ||  선택 요소의 메소드 이용
    ------------------------------------------------------------
스타일 |  .sytle.스타일속성 = "변경할 값";   ||  .css("스타일속성", "변경할 값");
 내용  |  .innerHTML = "변경할 값";         ||  .html("변경할 값");
이벤트 |  .on이벤트명(click등) = function() ||  .이벤트명(function(){});

-->



    </body>
</html>
