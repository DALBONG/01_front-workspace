<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>요소선택(기본선택자)</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>


</head>
    <body>
        <h1>기본 선택자 이용해서 요소 선택</h1>
        
        <h3>아이디 선택자</h3>
        <p>특정 고유한 id값 '하나만'을 선택</p>
        
        <h1 id="test1">테스트1</h1>
        <h2 id="test2">테스트2</h2>


        <script>
            $(function(){
                // 순수 JS방식 : document.getElementById("id명")
                document.getElementById("test1").style.color = "red"
                    // 선택 요소 객체의 속성에 접근하여 값 변경.
                document.getElementById("test1").innerHTML = "h1변경"

                // jQuery 방식 : $("id명").css
                $("#test2").css("color","yellow")
                $("#test2").html("변경") 
                    //.html 메소드 : 선택한 요소의 innerHTML과 관련된 기능을 수행하는 메소드
                console.log(document.getElementById("test1"))
                console.log($("#test1"))
            })
        </script>
    </body>
</html>
